<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgViraat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="50%" stop-color="#140f29"/>
      <stop offset="100%" stop-color="#070410"/>
    </linearGradient>
    <linearGradient id="accentViraat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgViraat)"/>

  <!-- Top bar -->
  <rect x="30" y="25" width="740" height="42" rx="12" fill="#1b1438" stroke="#31255e" stroke-width="1"/>
  <circle cx="55" cy="46" r="6" fill="#ef4444" />
  <circle cx="75" cy="46" r="6" fill="#eab308" />
  <circle cx="95" cy="46" r="6" fill="#22c55e" />
  <text x="130" y="51" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🛡️ VIRAAT — Autonomous Multi-Rail Fraud Defense &amp; Intelligence Engine</text>
  <rect x="620" y="34" width="130" height="24" rx="12" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1"/>
  <text x="685" y="50" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11" font-weight="700">&lt;15MS LATENCY</text>

  <!-- Left: 7-Layer Defense Matrix & Live Attack Block Canvas -->
  <g transform="translate(30, 85)">
    <rect width="450" height="380" rx="18" fill="#120d26" stroke="#2c1e54" stroke-width="1.5"/>

    <text x="25" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">7-LAYER IMMUNITY DEFENSE MATRIX</text>

    <!-- 7 Layer Horizontal Bars -->
    <g transform="translate(25, 45)">
      <!-- L0 -->
      <rect x="0" y="0" width="400" height="30" rx="6" fill="#1c143d" stroke="#372773" stroke-width="1"/>
      <text x="15" y="19" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="700">L0 INVARIANT</text>
      <text x="130" y="19" fill="#94a3b8" font-family="system-ui" font-size="10">Deterministic Policy &amp; Blacklist Filter</text>
      <text x="385" y="19" text-anchor="end" fill="#10b981" font-family="monospace" font-size="10">0.2ms</text>

      <!-- L1 -->
      <rect x="0" y="36" width="400" height="30" rx="6" fill="#1c143d" stroke="#372773" stroke-width="1"/>
      <text x="15" y="55" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="700">L1 GBDT ENSEMBLE</text>
      <text x="130" y="55" fill="#94a3b8" font-family="system-ui" font-size="10">232 Zero-Leak Causal Behavioral Features</text>
      <text x="385" y="55" text-anchor="end" fill="#10b981" font-family="monospace" font-size="10">2.1ms</text>

      <!-- L2 -->
      <rect x="0" y="72" width="400" height="30" rx="6" fill="#1c143d" stroke="#372773" stroke-width="1"/>
      <text x="15" y="91" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="700">L2 TRI-PLANE</text>
      <text x="130" y="91" fill="#94a3b8" font-family="system-ui" font-size="10">Tx Flow + GenAI Agent + Audio Biometrics</text>
      <text x="385" y="91" text-anchor="end" fill="#10b981" font-family="monospace" font-size="10">3.4ms</text>

      <!-- L3 -->
      <rect x="0" y="108" width="400" height="30" rx="6" fill="#1c143d" stroke="#372773" stroke-width="1"/>
      <text x="15" y="127" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="700">L3 TEMPORAL GRAPH</text>
      <text x="130" y="127" fill="#94a3b8" font-family="system-ui" font-size="10">Dynamic Mule Ring &amp; Sybil Subgraph Miner</text>
      <text x="385" y="127" text-anchor="end" fill="#10b981" font-family="monospace" font-size="10">4.0ms</text>

      <!-- L4-L6 (Combined stack) -->
      <rect x="0" y="144" width="400" height="30" rx="6" fill="#241030" stroke="#5b1f48" stroke-width="1"/>
      <text x="15" y="163" fill="#fda4af" font-family="monospace" font-size="11" font-weight="700">L4-L6 RESIDUAL &amp; CONFORMAL</text>
      <text x="195" y="163" fill="#cbd5e1" font-family="system-ui" font-size="10">99.0% Conformal Coverage • Stacker</text>
      <text x="385" y="163" text-anchor="end" fill="#f43f5e" font-family="monospace" font-size="10">4.8ms</text>
    </g>

    <!-- Live Transaction Threat Assessment Box -->
    <rect x="25" y="235" width="400" height="120" rx="12" fill="#080512" stroke="#221642" stroke-width="1.5"/>
    <text x="40" y="260" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ADVERSARIAL ATTACK INTERCEPTED</text>

    <text x="40" y="285" fill="#fecdd3" font-family="monospace" font-size="11">&gt; Rail: FedNow / UPI AP2 Mandate Injection</text>
    <text x="40" y="305" fill="#e2e8f0" font-family="monospace" font-size="11">&gt; Attack Vector: Deepfake Synthetic Identity #67</text>
    <text x="40" y="330" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">&gt; Verdict: HARD_BLOCK (P_fraud: 0.9984 | FPR: 0.08%)</text>
  </g>

  <!-- Right: Technical Benchmarks -->
  <g transform="translate(500, 85)">
    <!-- Card 1: Conformal Guarantee -->
    <rect width="270" height="115" rx="16" fill="#120d26" stroke="#2c1e54" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CONFORMAL COVERAGE</text>
    <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">99.0<tspan font-size="16" fill="#f43f5e">%</tspan></text>
    <text x="20" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Strict FPR @ 0.1% Industrial Standard</text>

    <!-- Card 2: Multi-Rail Engine -->
    <g transform="translate(0, 130)">
      <rect width="270" height="115" rx="16" fill="#120d26" stroke="#2c1e54" stroke-width="1.5"/>
      <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PAYMENT RAILS COVERED</text>
      <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">12 Active</text>
      <text x="20" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">FedNow • UPI • Swift • Card • SEPA</text>
    </g>

    <!-- Card 3: Stack -->
    <g transform="translate(0, 260)">
      <rect width="270" height="120" rx="16" fill="#120d26" stroke="#2c1e54" stroke-width="1.5"/>
      <text x="20" y="30" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CORE ARCHITECTURE</text>
      <rect x="20" y="46" width="65" height="24" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
      <text x="52" y="62" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="700">FastAPI</text>

      <rect x="92" y="46" width="65" height="24" rx="6" fill="#431407" stroke="#9a3412" stroke-width="1"/>
      <text x="124" y="62" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="10" font-weight="700">Python</text>

      <rect x="164" y="46" width="85" height="24" rx="6" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
      <text x="206" y="62" text-anchor="middle" fill="#99f6e4" font-family="monospace" font-size="10" font-weight="700">Graph GNN</text>
      <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">MAP-Elites Adversarial Quality-Diversity</text>
    </g>
  </g>
</svg>
