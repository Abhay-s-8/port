<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgInfomind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="50%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgInfomind)"/>

  <!-- Top Window Header -->
  <rect x="30" y="25" width="740" height="42" rx="12" fill="#152438" stroke="#223a59" stroke-width="1"/>
  <circle cx="55" cy="46" r="6" fill="#ef4444" />
  <circle cx="75" cy="46" r="6" fill="#eab308" />
  <circle cx="95" cy="46" r="6" fill="#22c55e" />
  <text x="130" y="51" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">InfoMind AI Enterprise — Intelligent Information Management &amp; Grounded RAG</text>
  <rect x="620" y="34" width="130" height="24" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
  <text x="685" y="50" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SSE STREAMING</text>

  <!-- Left: Staged Ingestion & Classification Pipeline -->
  <g transform="translate(30, 85)">
    <rect width="450" height="380" rx="18" fill="#0d1b2a" stroke="#1f3854" stroke-width="1.5"/>

    <!-- Ingestion Pipeline Stage Box -->
    <rect x="25" y="20" width="400" height="75" rx="12" fill="#13273e" stroke="#24456a" stroke-width="1"/>
    <text x="40" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">STAGED INGESTION &amp; EXTRACTION PIPELINE</text>

    <!-- Pipeline steps -->
    <g transform="translate(40, 52)">
      <rect x="0" y="0" width="65" height="26" rx="6" fill="#1e3a5f"/>
      <text x="32" y="17" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="10">Extract</text>

      <text x="75" y="17" fill="#64748b" font-family="system-ui" font-size="12">→</text>

      <rect x="90" y="0" width="65" height="26" rx="6" fill="#1e3a5f"/>
      <text x="122" y="17" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="10">Chunk</text>

      <text x="165" y="17" fill="#64748b" font-family="system-ui" font-size="12">→</text>

      <rect x="180" y="0" width="65" height="26" rx="6" fill="#1e3a5f"/>
      <text x="212" y="17" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="10">Embed</text>

      <text x="255" y="17" fill="#64748b" font-family="system-ui" font-size="12">→</text>

      <rect x="270" y="0" width="75" height="26" rx="6" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
      <text x="307" y="17" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">Classify</text>
    </g>

    <!-- Grounded RAG Assistant Streaming Box -->
    <rect x="25" y="110" width="400" height="245" rx="14" fill="#09131d" stroke="#1c3652" stroke-width="1.5"/>
    <div xmlns="http://www.w3.org/1999/xhtml">
      <span style="color: #64748b; font-size: 10px;">RAG Assistant</span>
    </div>
    <text x="45" y="135" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Grounded RAG Assistant (Owner-Only Verified Access):</text>

    <!-- User query -->
    <rect x="45" y="150" width="360" height="32" rx="8" fill="#13273e"/>
    <text x="58" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Q: "Summarize compliance requirements in Exhibit B with citations."</text>

    <!-- Assistant answer with verifiable citation tags -->
    <rect x="45" y="192" width="360" height="110" rx="8" fill="#0c1825" stroke="#1f3d5c" stroke-width="1"/>
    <text x="58" y="215" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Answer (Validated via Sufficiency Gate):</text>
    <text x="58" y="238" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">"Exhibit B specifies mandatory TLS 1.3 encryption for all endpoints</text>
    <text x="58" y="258" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">and quarterly access audits</text>
    <rect x="215" y="246" width="95" height="18" rx="4" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
    <text x="262" y="259" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">[Doc #4, chunk 2]</text>

    <rect x="58" y="275" width="130" height="20" rx="6" fill="#065f46"/>
    <text x="123" y="289" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Evidence Sufficiency Passed</text>
  </g>

  <!-- Right: Architecture & Benchmark Metrics -->
  <g transform="translate(500, 85)">
    <!-- Card 1: Vector Search + Hybrid -->
    <rect width="270" height="115" rx="16" fill="#0d1b2a" stroke="#1f3854" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HYBRID RETRIEVAL</text>
    <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Qdrant + BM25</text>
    <text x="20" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Nomic Embeddings • Dense + Keyword</text>

    <!-- Card 2: ML Classifier Specs -->
    <g transform="translate(0, 130)">
      <rect width="270" height="115" rx="16" fill="#0d1b2a" stroke="#1f3854" stroke-width="1.5"/>
      <text x="20" y="30" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ML CLASSIFICATION</text>
      <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Scikit-Learn</text>
      <text x="20" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TF-IDF • Logistic Regression vs Linear SVM</text>
    </g>

    <!-- Card 3: Stack -->
    <g transform="translate(0, 260)">
      <rect width="270" height="120" rx="16" fill="#0d1b2a" stroke="#1f3854" stroke-width="1.5"/>
      <text x="20" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CORE SYSTEM STACK</text>
      <rect x="20" y="46" width="65" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52" y="62" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10" font-weight="700">FastAPI</text>

      <rect x="92" y="46" width="65" height="24" rx="6" fill="#172554" stroke="#1e40af" stroke-width="1"/>
      <text x="124" y="62" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="700">Qdrant</text>

      <rect x="164" y="46" width="85" height="24" rx="6" fill="#311042" stroke="#7e22ce" stroke-width="1"/>
      <text x="206" y="62" text-anchor="middle" fill="#d8b4fe" font-family="monospace" font-size="10" font-weight="700">Ollama LLaMA</text>
      <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PostgreSQL • Alembic • React + Vite UI</text>
    </g>
  </g>
</svg>
