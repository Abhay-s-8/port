<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#18112c"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Ambient light circles -->
  <circle cx="200" cy="180" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="180" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Bar / Window Controls -->
  <rect x="30" y="25" width="740" height="42" rx="12" fill="#1e1838" stroke="#3b2d66" stroke-width="1"/>
  <circle cx="55" cy="46" r="6" fill="#ef4444" />
  <circle cx="75" cy="46" r="6" fill="#eab308" />
  <circle cx="95" cy="46" r="6" fill="#22c55e" />
  <text x="130" y="51" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Siya 3D — AI Behavioral & Technical Mock Interviewer</text>
  <rect x="630" y="34" width="120" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
  <circle cx="645" cy="46" r="4" fill="#22c55e" />
  <text x="656" y="50" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LIVE AUDIO</text>

  <!-- Left Card: 3D AI Interviewer Stage -->
  <g transform="translate(30, 85)">
    <rect width="420" height="380" rx="18" fill="#140e28" stroke="#312356" stroke-width="1.5"/>

    <!-- Avatar Hologram Circle -->
    <circle cx="210" cy="160" r="100" fill="url(#avatarGlow)" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="210" cy="160" r="80" fill="#1c133a" stroke="#d946ef" stroke-width="1.5"/>

    <!-- Stylized AI Face / Core -->
    <circle cx="210" cy="145" r="40" fill="#271b4d"/>
    <path d="M 185 140 Q 210 120 235 140" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="195" cy="145" r="5" fill="#38bdf8"/>
    <circle cx="225" cy="145" r="5" fill="#38bdf8"/>
    <path d="M 198 165 Q 210 175 222 165" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- 3D Orbit Rings -->
    <ellipse cx="210" cy="160" rx="125" ry="45" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" transform="rotate(-15 210 160)"/>
    <ellipse cx="210" cy="160" rx="125" ry="45" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" transform="rotate(25 210 160)"/>

    <!-- Live Audio Waveform -->
    <g transform="translate(70, 280)">
      <rect x="0" y="10" width="6" height="25" rx="3" fill="#a855f7"/>
      <rect x="14" y="0" width="6" height="45" rx="3" fill="#ec4899"/>
      <rect x="28" y="15" width="6" height="15" rx="3" fill="#8b5cf6"/>
      <rect x="42" y="5" width="6" height="35" rx="3" fill="#f43f5e"/>
      <rect x="56" y="18" width="6" height="10" rx="3" fill="#a855f7"/>
      <rect x="70" y="2" width="6" height="41" rx="3" fill="#ec4899"/>
      <rect x="84" y="12" width="6" height="20" rx="3" fill="#8b5cf6"/>
      <rect x="98" y="0" width="6" height="45" rx="3" fill="#d946ef"/>
      <rect x="112" y="8" width="6" height="28" rx="3" fill="#a855f7"/>
      <rect x="126" y="16" width="6" height="12" rx="3" fill="#f43f5e"/>
      <rect x="140" y="4" width="6" height="38" rx="3" fill="#ec4899"/>
      <rect x="154" y="14" width="6" height="18" rx="3" fill="#8b5cf6"/>
      <rect x="168" y="0" width="6" height="45" rx="3" fill="#a855f7"/>
      <rect x="182" y="9" width="6" height="26" rx="3" fill="#d946ef"/>
      <rect x="196" y="17" width="6" height="11" rx="3" fill="#f43f5e"/>
      <rect x="210" y="5" width="6" height="35" rx="3" fill="#ec4899"/>
      <rect x="224" y="12" width="6" height="21" rx="3" fill="#8b5cf6"/>
      <rect x="238" y="2" width="6" height="41" rx="3" fill="#a855f7"/>
      <rect x="252" y="15" width="6" height="15" rx="3" fill="#d946ef"/>
      <rect x="266" y="8" width="6" height="29" rx="3" fill="#ec4899"/>
    </g>

    <text x="210" y="350" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="500">"Explain how you design a fault-tolerant distributed cache in C++..."</text>
  </g>

  <!-- Right Column: Real-time Evaluation Cards -->
  <g transform="translate(470, 85)">
    <!-- Card 1: Score & Metrics -->
    <rect width="300" height="115" rx="16" fill="#140e28" stroke="#312356" stroke-width="1.5"/>
    <text x="20" y="32" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE PERFORMANCE SCORE</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800">94<tspan font-size="20" fill="#9ca3af">/100</tspan></text>
    <rect x="170" y="42" width="110" height="26" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="225" y="59" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STRONG HIRE</text>

    <!-- Progress Bars -->
    <rect x="20" y="92" width="260" height="6" rx="3" fill="#2d1f47"/>
    <rect x="20" y="92" width="244" height="6" rx="3" fill="url(#accent)"/>

    <!-- Card 2: Behavioral & Technical Radar -->
    <g transform="translate(0, 130)">
      <rect width="300" height="115" rx="16" fill="#140e28" stroke="#312356" stroke-width="1.5"/>
      <text x="20" y="32" fill="#ec4899" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">EVALUATION RUBRICS</text>

      <text x="20" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Technical Accuracy</text>
      <text x="260" y="60" text-anchor="end" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">96%</text>

      <text x="20" y="85" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Problem Decomposition</text>
      <text x="260" y="85" text-anchor="end" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">92%</text>

      <text x="20" y="110" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Communication & Clarity</text>
      <text x="260" y="110" text-anchor="end" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">94%</text>
    </g>

    <!-- Card 3: AI Engine Specs -->
    <g transform="translate(0, 260)">
      <rect width="300" height="120" rx="16" fill="#140e28" stroke="#312356" stroke-width="1.5"/>
      <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AGENT ARCHITECTURE</text>
      <rect x="20" y="46" width="78" height="24" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
      <text x="59" y="62" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Three.js 3D</text>

      <rect x="106" y="46" width="92" height="24" rx="6" fill="#431407" stroke="#9a3412" stroke-width="1"/>
      <text x="152" y="62" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Gemini Live</text>

      <rect x="206" y="46" width="74" height="24" rx="6" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
      <text x="243" y="62" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">WebAudio</text>

      <text x="20" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Real-time STT latency: ~140ms • Sub-second AI inference</text>
    </g>
  </g>
</svg>
